name: Check proofs and diagnostics
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install the Python adapter
        run: python -m pip install -e .
      - name: Install pinned elan
        run: |
          curl --fail --location https://github.com/leanprover/elan/releases/download/v4.2.4/elan-x86_64-unknown-linux-gnu.tar.gz -o elan.tar.gz
          tar xzf elan.tar.gz
          ./elan-init -y --no-modify-path --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Fetch pinned Mathlib artifacts
        env:
          MATHLIB_NO_CACHE_ON_UPDATE: '1'
        run: |
          lake update
          lake exe cache get Mathlib.Basic.Real.Basic Mathlib.Tactic.Linarith Mathlib.Tactic.NormNum Mathlib.Tactic.Positivity Mathlib.Analysis.Real.Sqrt Mathlib.Tactic.Ring
      - name: Build and run native Lean checks
        run: |
          lake build
          lake env lean lean-tests/Native.lean
          lake env lean examples/Native.lean
          python scripts/verify_paper.py
          python scripts/verify_solow.py
      - name: Check Python boundaries and regenerate certificates
        env:
          THEORYDEBUGGER_TEST_LEAN: '1'
        run: |
          python -m unittest discover -s tests -v
          python scripts/run_demo.py
          python scripts/check_saved_evidence.py
          python scripts/run_economics.py
          python scripts/check_saved_evidence.py demo/economics/results.json
          python scripts/run_repairs.py
          python scripts/check_saved_evidence.py demo/repairs/results.json
